{% extends "base.html" %}{% block content %}<div class="card" style="max-width:520px;margin:30px auto;text-align:center">
{% if v.status == 'APPROVED' %}<h1 class="ok" style="font-size:1.6rem">Identity verified</h1>{% else %}<h1 style="font-size:1.6rem">Under review</h1><p class="mute">Submitted {{ v.submitted_at|date:"j M, H:i" }}. We'll email and text you when it's done.</p>{% endif %}
<a class="btn" href="{% url 'dashboard' %}">Back to dashboard</a></div>{% endblock %}
