{% extends "dash_base.html" %}{% load ui %}{% block dash %}
<h1>Photos</h1><div class="card" style="max-width:520px"><form method="post" enctype="multipart/form-data">{% csrf_token %}{{ form.as_p }}<button>Upload</button></form><p class="mute">JPEG, PNG or WebP up to 5 MB. We remove location data from photos.</p></div>
<div class="grid" style="margin-top:16px">{% for p in photos %}<div class="card"><img src="{{ p.image.url }}" alt="{{ p.caption|default:'Business photo' }}" style="width:100%;border-radius:8px"><form method="post" action="{% url 'photo_delete' p.id %}">{% csrf_token %}<button class="btn ghost" style="margin-top:8px">Delete</button></form></div>{% endfor %}</div>{% endblock %}
