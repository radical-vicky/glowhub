{% extends "dash_base.html" %}{% load ui %}{% block dash %}<div class="row"><h1>Inventory</h1><a class="btn" href="{% url 'item_create' %}">Add item</a></div>
<div class="card"><table><tr><th>Item</th><th>Stock</th><th>Min. level</th><th>Status</th><th></th></tr>{% for i in items %}<tr><td>{{ i.name }}</td><td>{{ i.quantity }} {{ i.unit }}</td><td>{{ i.reorder_level }}</td><td><span class="pill {% if i.status == 'In Stock' %}ok{% elif i.status == 'Out' %}bad{% else %}warn{% endif %}">{{ i.status }}</span></td><td><a class="accent" href="{% url 'move_stock' i.id %}">Adjust stock</a></td></tr>{% empty %}<tr><td class="mute">No items yet.</td></tr>{% endfor %}</table></div>{% endblock %}
