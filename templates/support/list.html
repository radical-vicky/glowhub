{% extends "dash_base.html" %}{% load ui %}{% block dash %}
<h1>Support</h1><div class="card" style="max-width:600px"><form method="post">{% csrf_token %}{{ form.as_p }}<button>Send</button></form></div>
<h2>Your requests</h2>{% for t in tickets %}<a class="card row" style="margin-bottom:8px" href="{% url 'ticket' t.id %}"><span>#{{ t.id }} {{ t.subject }}</span><span class="pill {{ t.status|pillclass }}">{{ t.get_kind_display }} · {{ t.get_status_display }}</span></a>{% empty %}<p class="mute">No requests yet.</p>{% endfor %}{% endblock %}
